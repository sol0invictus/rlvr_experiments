# ============================================================================
# REPLICATION: Sec. 5 Direct-RLVR, Qwen3-4B, basic_arithmetic, 300 steps.
# Body = configs_by_section/sec5_atomic_curriculum/per_task/basic_arithmetic/direct_rlvr_4b.yaml
# Only recipe-preserving changes (see PHASE_A.md):
#   - 1 GPU: per_device_train_batch_size 1 -> 8 so one optimizer step is still
#     1 prompt x 8 completions (original: 8 GPUs x 1). generation_batch_size 8 is
#     global in TRL, so it stays 8.
#   - gradient_checkpointing on (memory only, same math)
#   - weights-only checkpoints every 25 steps, none deleted (save_total_limit removed)
#   - tensorboard logging; every generation saved (flushed every 25 steps)
#   - paths point at the VM volume
# Left exactly as the original code saw them (NOT passed to TRL by train_grpo.py):
#   epsilon_high, mask_truncated_completions, warmup_ratio, kl_coeff, max_prompt_length
# ============================================================================
environment:
  length_penalty: true
  max_rollout_length: 2048
  name: reasoning_gym
  samples: 5000
  task_name: basic_arithmetic
  task_params: {}
generation:
  generation_batch_size: 8
  max_completion_length: 2048
  max_prompt_length: 512
  num_generations: 8
  stop_strings:
  - </answer>
  temperature: 1.0
generation_logging:
  enabled: true
  every_n_steps: 25
  log_dir: /data/rlvr/grpo_basic_arithmetic_4b/generations
  print_n_examples: 2
model:
  name_or_path: /data/rlvr/sft_qwen3_4b
  torch_dtype: bfloat16
seed: 42
system_prompt: 'You are a helpful assistant. You must always think step-by-step. Put
  your thinking process inside <think> and </think> tags, and put your final answer
  inside <answer> and </answer> tags.

  '
training:
  beta: 0.0
  bf16: true
  epsilon_high: 5.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  kl_coeff: 0.0
  learning_rate: 5.0e-06
  logging_steps: 1
  loss_type: dapo
  lr_scheduler_type: constant
  mask_truncated_completions: true
  max_grad_norm: 1.0
  max_steps: 300
  num_train_epochs: 2
  output_dir: /data/rlvr/grpo_basic_arithmetic_4b
  per_device_train_batch_size: 8
  report_to:
  - tensorboard
  save_only_model: true
  save_steps: 25
  save_strategy: steps
  warmup_ratio: 0.1
