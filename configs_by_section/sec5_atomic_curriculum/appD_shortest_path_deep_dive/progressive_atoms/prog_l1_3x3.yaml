# ============================================================================
# PAPER SECTION : App. D
# ROLE          : progressive atoms, L1 3x3, 100 steps (run_sp_push_higher.sh). Not a numbered table condition
# INIT MODEL    : /scratch/sunguha/sft_qwen_4.0b_instruct
# TASK          : shortest_path (atom layer L1)
# LR / STEPS / GENS : 5e-06 / 100 / 8
# ORIGINAL FILE : configs/phase2_shortest_path/prog_l1_3x3.yaml
# NOTE          : copy for sharing; body below is unmodified. Scripts still use the original path.
# ============================================================================
environment:
  name: atomic
  base_task: shortest_path
  atom_layer: L1
  samples: 5000
  task_params:
    min_rows: 3
    max_rows: 3
    min_cols: 3
    max_cols: 3
generation:
  generation_batch_size: 8
  max_completion_length: 256
  max_prompt_length: 512
  num_generations: 8
  stop_strings:
    - </answer>
  temperature: 1.0
generation_logging:
  enabled: true
  every_n_steps: 10
  log_dir: results/phase2_sp/prog_l1_3x3/generations
  print_n_examples: 5
model:
  name_or_path: /scratch/sunguha/sft_qwen_4.0b_instruct
  torch_dtype: bfloat16
seed: 42
system_prompt: >
  You are a helpful assistant. You must always think step-by-step. Put
  your thinking process inside <think> and </think> tags, and put your final answer
  inside <answer> and </answer> tags.
training:
  beta: 0.0
  bf16: true
  epsilon_high: 5.0
  gradient_accumulation_steps: 1
  kl_coeff: 0.0
  learning_rate: 5.0e-06
  logging_steps: 1
  loss_type: dapo
  lr_scheduler_type: constant
  mask_truncated_completions: true
  max_grad_norm: 1.0
  max_steps: 100
  num_train_epochs: 2
  output_dir: results/phase2_sp/prog_l1_3x3
  per_device_train_batch_size: 1
  report_to: []
  save_steps: 50
  save_strategy: steps
  save_total_limit: 2
  warmup_ratio: 0.1
