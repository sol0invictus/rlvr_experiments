# ============================================================================
# PAPER SECTION : Sec. 5 / App. C
# ROLE          : Direct-RLVR baseline on full task, 4B, 300 steps
# INIT MODEL    : /scratch/sunguha/sft_qwen_4.0b_instruct
# TASK          : syllogism
# LR / STEPS / GENS : 5e-06 / 300 / 8
# ORIGINAL FILE : configs/phase2_extended/syllogism/direct_rlvr.yaml
# NOTE          : copy for sharing; body below is unmodified. Scripts still use the original path.
# ============================================================================
environment:
  name: reasoning_gym
  task_name: syllogism
  samples: 5000
  task_params: {}
generation:
  generation_batch_size: 8
  max_completion_length: 1024
  max_prompt_length: 512
  num_generations: 8
  stop_strings:
    - </answer>
  temperature: 1.0
generation_logging:
  enabled: true
  every_n_steps: 20
  log_dir: results/phase2_ext/syllogism/direct_rlvr/generations
  print_n_examples: 5
model:
  name_or_path: /scratch/sunguha/sft_qwen_4.0b_instruct
  torch_dtype: bfloat16
seed: 42
system_prompt: >
  You are a helpful assistant. You must always think step-by-step. Put
  your thinking process inside <think> and </think> tags, and put your final answer
  inside <answer> and </answer> tags.
training:
  beta: 0.0
  bf16: true
  epsilon_high: 5.0
  gradient_accumulation_steps: 1
  kl_coeff: 0.0
  learning_rate: 5.0e-06
  logging_steps: 1
  loss_type: dapo
  lr_scheduler_type: constant
  mask_truncated_completions: true
  max_grad_norm: 1.0
  max_steps: 300
  num_train_epochs: 2
  output_dir: results/phase2_ext/syllogism/direct_rlvr
  per_device_train_batch_size: 1
  report_to: []
  save_steps: 50
  save_strategy: steps
  save_total_limit: 3
  warmup_ratio: 0.1
