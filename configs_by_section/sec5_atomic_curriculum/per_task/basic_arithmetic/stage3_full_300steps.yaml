# ============================================================================
# PAPER SECTION : Sec. 5 / App. C
# ROLE          : Atomic-Warm stage 3: full task, 300-step variant (init: stage 2)
# INIT MODEL    : results/phase2_arith/stage2_l2
# TASK          : basic_arithmetic
# LR / STEPS / GENS : 5e-06 / 300 / 8
# ORIGINAL FILE : configs/phase2_arithmetic/stage3_full_300steps.yaml
# NOTE          : copy for sharing; body below is unmodified. Scripts still use the original path.
# ============================================================================
environment:
  name: reasoning_gym
  task_name: basic_arithmetic
  samples: 5000
  task_params: {}
  length_penalty: true
  max_rollout_length: 2048
generation:
  generation_batch_size: 8
  max_completion_length: 2048
  max_prompt_length: 512
  num_generations: 8
  stop_strings:
    - </answer>
  temperature: 1.0
generation_logging:
  enabled: true
  every_n_steps: 20
  log_dir: results/phase2_arith/atomic_warm_300/generations
  print_n_examples: 5
model:
  # Init from Stage 2 (post-atoms) checkpoint
  name_or_path: results/phase2_arith/stage2_l2
  torch_dtype: bfloat16
seed: 42
system_prompt: >
  You are a helpful assistant. You must always think step-by-step. Put
  your thinking process inside <think> and </think> tags, and put your final answer
  inside <answer> and </answer> tags.
training:
  beta: 0.0
  bf16: true
  epsilon_high: 5.0
  gradient_accumulation_steps: 1
  kl_coeff: 0.0
  learning_rate: 5.0e-06
  logging_steps: 1
  loss_type: dapo
  lr_scheduler_type: constant
  mask_truncated_completions: true
  max_grad_norm: 1.0
  max_steps: 300
  num_train_epochs: 2
  output_dir: results/phase2_arith/atomic_warm_300
  per_device_train_batch_size: 1
  report_to: []
  save_steps: 25
  save_strategy: steps
  save_total_limit: 3
  warmup_ratio: 0.1
