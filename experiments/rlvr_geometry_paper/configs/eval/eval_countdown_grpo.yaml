# ============================================================================
# Evaluation config — Countdown: GRPO Model (after RL on 4-5 number task)
#
# Usage:
#   torchrun --nproc_per_node=8 evaluate.py experiments/rlvr_geometry_paper/configs/eval/eval_countdown_grpo.yaml
# ============================================================================

model:
  name_or_path: /scratch/sunguha/rlvr_experiments/results/grpo_qwen_4b_instruct_countdown_4to5
  torch_dtype: bfloat16
  attn_implementation: flash_attention_2
  compile: false

environment:
  name: reasoning_gym
  task_name: countdown
  samples: 500
  task_params:
    min_numbers: 4
    max_numbers: 5
    min_target: 10
    max_target: 200

evaluation:
  num_samples: 500
  seed: 1653

generation:
  max_new_tokens: 2048
  temperature: 0.0
  batch_size: 4

system_prompt: |
  You are a helpful assistant. You must always think step-by-step. Put your thinking process inside <think> and </think> tags, and put your final answer inside <answer> and </answer> tags.

output_dir: experiments/rlvr_geometry_paper/outputs/evaluation/countdown_grpo/
