model:
  name_or_path: /scratch/sunguha/models/Qwen3-8B
  torch_dtype: bfloat16
sft:
  output_dir: experiments/rlvr_geometry_paper/outputs/sft_qwen3_8b
  output_file: data_gen/data/sft_warmup.jsonl
sft_training:
  batch_size: 2
  bf16: true
  gradient_accumulation_steps: 4
