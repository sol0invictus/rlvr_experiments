# ============================================================================
# PAPER SECTION : Sec. 4 (?)
# ROLE          : 4B countdown GRPO, 300 steps. Predates transfer_4b/; may be the 4B countdown row. UNVERIFIED
# INIT MODEL    : /scratch/sunguha/rlvr_experiments/outputs/sft_qwen3_4b
# TASK          : countdown
# LR / STEPS / GENS : 5e-06 / 300 / 8
# ORIGINAL FILE : configs/config_qwen3_4b_countdown_grpo.yaml
# NOTE          : copy for sharing; body below is unmodified. Scripts still use the original path.
# ============================================================================
# ============================================================================
# GRPO Training: Countdown task on Qwen3-4B (SFT-warmed)
# ============================================================================
# Usage:
#   torchrun --standalone --nproc_per_node=8 train_grpo.py configs/config_qwen3_4b_countdown_grpo.yaml
#
# Model: SFT'd Qwen3-4B-Base from outputs/sft_qwen3_4b
# Task: Countdown (reasoning_gym) — reach target number using arithmetic ops
# Hardware: 8x B200 (P6)
# ============================================================================

model:
  name_or_path: /scratch/sunguha/rlvr_experiments/outputs/sft_qwen3_4b
  torch_dtype: bfloat16

# --- Reasoning Gym Environment ---
environment:
  name: reasoning_gym
  task_name: countdown
  samples: 5000
  length_penalty: true
  max_rollout_length: 2048
  task_params:
    min_numbers: 5
    max_numbers: 5
    min_target: 50
    max_target: 300

seed: 42

# --- Training ---
training:
  output_dir: results/grpo_qwen3_4b_countdown
  learning_rate: 5.0e-6
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  num_train_epochs: 2
  bf16: true
  logging_steps: 1
  save_strategy: steps
  save_steps: 25
  save_total_limit: 3
  max_steps: 300
  report_to: ["tensorboard"]
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  kl_coeff: 0.0
  loss_type: "dapo"
  beta: 0.0
  mask_truncated_completions: true
  epsilon_high: 5.0
  lr_scheduler_type: constant

# --- Generation (GRPO rollouts) ---
generation:
  max_completion_length: 2048
  num_generations: 8
  generation_batch_size: 8
  max_prompt_length: 512
  temperature: 1.0
  stop_strings: ["</answer>"]

# --- System Prompt ---
system_prompt: |
  You are a helpful assistant. You must always think step-by-step. Put your thinking process inside <think> and </think> tags, and put your final answer inside <answer> and </answer> tags.

generation_logging:
  enabled: true
  log_dir: results/grpo_qwen3_4b_countdown/generations
  every_n_steps: 20
  print_n_examples: 20
