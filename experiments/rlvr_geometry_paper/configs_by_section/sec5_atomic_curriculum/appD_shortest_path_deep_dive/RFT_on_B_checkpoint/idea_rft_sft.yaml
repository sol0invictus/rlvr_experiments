# ============================================================================
# PAPER SECTION : App. D
# ROLE          : [RFT] light SFT on B's own verified traces (init: idea B stage 2)
# INIT MODEL    : results/phase2_sp/idea_b/stage2_full
# TASK          : -
# LR / STEPS / GENS : 1e-06 / - / -
# ORIGINAL FILE : configs/phase2_sp_ideas/idea_rft_sft.yaml
# NOTE          : copy for sharing; body below is unmodified. Scripts still use the original path.
# ============================================================================
model:
  name_or_path: results/phase2_sp/idea_b/stage2_full
  torch_dtype: bfloat16
sft:
  output_file: results/phase2_sp/idea_rft/rft_data.jsonl
training:
  output_dir: results/phase2_sp/idea_rft/sft
  learning_rate: 1.0e-06
  num_train_epochs: 1
  batch_size: 2
  gradient_accumulation_steps: 1
  bf16: true
  logging_steps: 10
  save_strategy: epoch
  save_steps: 9999
  max_seq_length: 2048
  report_to: []
