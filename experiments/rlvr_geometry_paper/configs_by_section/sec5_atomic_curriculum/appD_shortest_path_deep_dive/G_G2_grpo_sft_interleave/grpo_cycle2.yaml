# ============================================================================
# PAPER SECTION : App. D
# ROLE          : [G/G2] cycle 2: GRPO 50 steps. File settings are the G2 (light) variant; shared by run_idea_g.sh and run_idea_g2.sh
# INIT MODEL    : results/phase2_sp/idea_g2/cycle1_sft
# TASK          : shortest_path
# LR / STEPS / GENS : 5e-06 / 50 / 8
# ORIGINAL FILE : configs/phase2_sp_ideas/idea_g/grpo_cycle2.yaml
# NOTE          : copy for sharing; body below is unmodified. Scripts still use the original path.
# ============================================================================
environment:
  name: reasoning_gym
  task_name: shortest_path
  samples: 5000
  task_params: {}
  length_penalty: true
  max_rollout_length: 2048
generation:
  generation_batch_size: 8
  max_completion_length: 2048
  max_prompt_length: 1024
  num_generations: 8
  stop_strings:
    - </answer>
  temperature: 1.0
generation_logging:
  enabled: true
  every_n_steps: 10
  log_dir: results/phase2_sp/idea_g2/cycle2_grpo/generations
  print_n_examples: 5
model:
  name_or_path: results/phase2_sp/idea_g2/cycle1_sft
  torch_dtype: bfloat16
seed: 137
system_prompt: >
  You are a helpful assistant. You must always think step-by-step. Put
  your thinking process inside <think> and </think> tags, and put your final answer
  inside <answer> and </answer> tags.
training:
  beta: 0.0
  bf16: true
  epsilon_high: 5.0
  gradient_accumulation_steps: 1
  kl_coeff: 0.0
  learning_rate: 5.0e-06
  logging_steps: 1
  loss_type: dapo
  lr_scheduler_type: constant
  mask_truncated_completions: true
  max_grad_norm: 1.0
  max_steps: 50
  num_train_epochs: 2
  output_dir: results/phase2_sp/idea_g2/cycle2_grpo
  per_device_train_batch_size: 1
  report_to: []
  save_steps: 25
  save_strategy: steps
  save_total_limit: 2
  warmup_ratio: 0.1
