# ============================================================================
# Curriculum study, atom pilot: the L2 multiplication atom on its own. One signed multiplication with
# 2-4 digit operands ("Calculate -701 * 978."), correctness reward only, completions capped at 96 tokens.
# The cap is the point: the no-penalty full-task run reached 94% by writing out long multiplication
# (a hard product written out is right 94% of the time, in one step 65%), so shorter traces need the
# product in one step. 96 tokens fits a direct answer with sign handling (SFT median 65 on such
# prompts) but not a written-out one (no-penalty median 132). Otherwise as baseline_arith_4b_nolp.yaml.
# ============================================================================
environment:
  length_penalty: false
  max_rollout_length: 96
  name: reasoning_gym
  samples: 5000
  task_name: basic_arithmetic
  task_params:
    min_terms: 2
    max_terms: 2
    min_digits: 2
    max_digits: 4
    operators: ['*']
generation:
  generation_batch_size: 32
  max_completion_length: 96
  max_prompt_length: 512
  num_generations: 8
  stop_strings:
  - </answer>
  temperature: 1.0
generation_logging:
  enabled: true
  every_n_steps: 25
  print_n_examples: 1
model:
  name_or_path: /data/rlvr/sft_qwen3_4b
  torch_dtype: bfloat16
seed: 1
system_prompt: 'You are a helpful assistant. You must always think step-by-step. Put
  your thinking process inside <think> and </think> tags, and put your final answer
  inside <answer> and </answer> tags.

  '
training:
  beta: 0.0
  bf16: true
  epsilon_high: null
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  kl_coeff: 0.0
  learning_rate: 5.0e-06
  logging_steps: 1
  loss_type: dapo
  lr_scheduler_type: constant
  mask_truncated_completions: false
  max_grad_norm: 1.0
  max_steps: 300
  num_train_epochs: 2
  output_dir: /data/rlvr/curriculum/atom_mul_seed1
  save_final: false   # checkpoint-300 has the same weights
  per_device_train_batch_size: 2
  report_to:
  - tensorboard
  save_only_model: true
  save_steps: 100
  save_strategy: steps
  warmup_ratio: 0.0
vllm:
  enabled: true
  stop_strings: true
  mode: colocate
  gpu_memory_utilization: 0.2
  enable_sleep_mode: false
  importance_sampling_correction: false
