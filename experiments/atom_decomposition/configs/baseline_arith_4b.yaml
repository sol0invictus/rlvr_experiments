# ============================================================================
# Curriculum study, arm A (full task only): the fixed baseline every atom schedule must beat.
# Starts from configs/replication/grpo_basic_arithmetic_4b_vllm.yaml (the paper's Direct-RLVR recipe)
# with these changes:
#   - 4 prompts per optimizer step instead of 1 (8 completions each, 32 per step). Each step is still
#     one fully on-policy generation batch: generation_batch_size = per_device_train_batch_size (8)
#     x gradient_accumulation_steps (4). Learning rate unchanged.
#   - vLLM colocate generation (passed the HF-vs-vLLM rollout equivalence check at 4B, ~4.7x faster),
#     with sleep mode so the KV cache is freed during the backward pass.
#   - weights-only checkpoints every 100 steps (disk: 3 seeds x 3 x 8 GB must fit on the volume).
#   - seed and output_dir are set per run on the command line (train_grpo.py --seed --output_dir);
#     the seed also picks the training puzzles.
# Unchanged: SFT start, reward (correctness + length penalty), T = 1.0, 300 steps, lr 5e-6, DAPO loss, beta 0.
# ============================================================================
environment:
  length_penalty: true
  max_rollout_length: 2048
  name: reasoning_gym
  samples: 5000
  task_name: basic_arithmetic
  task_params: {}
generation:
  generation_batch_size: 32
  max_completion_length: 2048
  max_prompt_length: 512
  num_generations: 8
  stop_strings:
  - </answer>
  temperature: 1.0
generation_logging:
  enabled: true
  every_n_steps: 25
  print_n_examples: 1
model:
  name_or_path: /data/rlvr/sft_qwen3_4b
  torch_dtype: bfloat16
seed: 1
system_prompt: 'You are a helpful assistant. You must always think step-by-step. Put
  your thinking process inside <think> and </think> tags, and put your final answer
  inside <answer> and </answer> tags.

  '
training:
  beta: 0.0
  bf16: true
  epsilon_high: null
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  kl_coeff: 0.0
  learning_rate: 5.0e-06
  logging_steps: 1
  loss_type: dapo
  lr_scheduler_type: constant
  mask_truncated_completions: false
  max_grad_norm: 1.0
  max_steps: 300
  num_train_epochs: 2
  output_dir: /data/rlvr/curriculum/arith_A_seed1
  per_device_train_batch_size: 8
  report_to:
  - tensorboard
  save_only_model: true
  save_steps: 100
  save_strategy: steps
  warmup_ratio: 0.0
vllm:
  enabled: true
  stop_strings: true
  mode: colocate
  gpu_memory_utilization: 0.3
  enable_sleep_mode: true
  importance_sampling_correction: false
