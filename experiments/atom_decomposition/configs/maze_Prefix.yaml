# ============================================================================
# Maze bridge arms, #1 "Prefix": hard mazes with half the prompts replaced by the same kind of hard maze with
# the first k moves of a shortest path given in the prompt (k from 1 to D-1; tasks/maze.py graph "prefix").
# The answer is still the full path length. Atoms inside the task: the model practises continuing and
# counting a path on hard grids, with real signal, in the full-task format. 300 steps, like A/B/C.
# ============================================================================
environment:
  atom_mix:
    fraction: 0.5
    source: decomposition
    graph: prefix
    task_params:   # hard-size mazes, as in the target
      min_dist: 10
      max_dist: 15
      min_grid_size: 10
      max_grid_size: 14
  strict_format: true
  length_penalty: false
  max_rollout_length: 2048
  name: reasoning_gym
  samples: 5000
  task_name: maze
  task_params:
    min_dist: 10
    max_dist: 15
    min_grid_size: 10
    max_grid_size: 14
generation:
  generation_batch_size: 32
  max_completion_length: 1024   # training only (evals keep 2048): a few 2048-token ramblers per step made it 38 s/step
  max_prompt_length: 1024   # atom prompts list reached cells (up to ~900 chars)
  num_generations: 8
  stop_strings:
  - </answer>
  temperature: 1.0
generation_logging:
  enabled: true
  every_n_steps: 25
  print_n_examples: 1
model:
  name_or_path: /data/rlvr/sft_qwen3_4b
  torch_dtype: bfloat16
seed: 1
system_prompt: 'You are a helpful assistant. You must always think step-by-step. Put
  your thinking process inside <think> and </think> tags, and put your final answer
  inside <answer> and </answer> tags.

  '
training:
  beta: 0.0
  bf16: true
  epsilon_high: null
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  kl_coeff: 0.0
  learning_rate: 5.0e-06
  logging_steps: 1
  loss_type: dapo
  lr_scheduler_type: constant
  mask_truncated_completions: false
  max_grad_norm: 1.0
  max_steps: 300
  num_train_epochs: 2
  output_dir: /ephemeral/maze/maze_Prefix_seed1
  save_final: false   # checkpoint-300 has the same weights
  per_device_train_batch_size: 2
  report_to:
  - tensorboard
  save_only_model: true
  save_steps: 100
  save_strategy: steps
  warmup_ratio: 0.0
vllm:
  enabled: true
  stop_strings: true
  mode: colocate
  gpu_memory_utilization: 0.2
  enable_sleep_mode: false
  importance_sampling_correction: false
