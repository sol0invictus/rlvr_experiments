# ============================================================================
# Planted shortcut on the hard split (brainstorm section 3, optional moderator): arith_planted_q03.yaml on
# big-product puzzles only (hard_only: the prompt multiplies a big pair), q = 0.3. Planted puzzles are big-product
# ones too. Does the shortcut win only when the skill is out of reach? samples 2000 (300 steps use 1,200 prompts).
# ============================================================================
environment:
  hard_only: true
  planted: {fraction: 0.3, answer: "-1"}
  length_penalty: false
  max_rollout_length: 2048
  name: reasoning_gym
  samples: 2000
  task_name: basic_arithmetic
  task_params: {}
generation:
  generation_batch_size: 32
  max_completion_length: 2048
  max_prompt_length: 512
  num_generations: 8
  stop_strings:
  - </answer>
  temperature: 1.0
generation_logging:
  enabled: true
  every_n_steps: 25
  print_n_examples: 1
model:
  name_or_path: /data/rlvr/sft_qwen3_4b
  torch_dtype: bfloat16
seed: 1
system_prompt: 'You are a helpful assistant. You must always think step-by-step. Put
  your thinking process inside <think> and </think> tags, and put your final answer
  inside <answer> and </answer> tags.

  '
training:
  beta: 0.0
  bf16: true
  epsilon_high: null
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  kl_coeff: 0.0
  learning_rate: 5.0e-06
  logging_steps: 1
  loss_type: dapo
  lr_scheduler_type: constant
  mask_truncated_completions: false
  max_grad_norm: 1.0
  max_steps: 300
  num_train_epochs: 2
  output_dir: /ephemeral/queue2/arith_hard_q03_seed1
  per_device_train_batch_size: 2
  report_to:
  - tensorboard
  save_only_model: true
  save_steps: 100000   # only save_at_steps
  save_at_steps: [100, 200, 300]
  save_final: false
  save_strategy: steps
  warmup_ratio: 0.0
vllm:
  enabled: true
  stop_strings: true
  mode: colocate
  gpu_memory_utilization: 0.2
  enable_sleep_mode: false
  importance_sampling_correction: false
