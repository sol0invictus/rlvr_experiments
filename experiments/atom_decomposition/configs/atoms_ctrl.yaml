# ============================================================================
# Atoms closing control (brainstorm sections 4 and 12): cur_mixed.yaml (half the prompts are the L2
# multiplication atom) with NO token cap on the atoms, run 600 steps so the full-task prompts seen equal the
# 300-step baseline's (4 prompts/step, half atoms). strict_format as in cur_mixed (the atom arms learned to
# answer inside <think>). Compare with arith_planted_q00 (same full-task prompt count) at its step 300.
# ============================================================================
environment:
  atom_mix:
    fraction: 0.5
    task_params:
      min_terms: 2
      max_terms: 2
      min_digits: 2
      max_digits: 4
      operators: ['*']
  strict_format: true
  length_penalty: false
  max_rollout_length: 2048
  name: reasoning_gym
  samples: 5000
  task_name: basic_arithmetic
  task_params: {}
generation:
  generation_batch_size: 32
  max_completion_length: 2048
  max_prompt_length: 512
  num_generations: 8
  stop_strings:
  - </answer>
  temperature: 1.0
generation_logging:
  enabled: true
  every_n_steps: 25
  print_n_examples: 1
model:
  name_or_path: /data/rlvr/sft_qwen3_4b
  torch_dtype: bfloat16
seed: 1
system_prompt: 'You are a helpful assistant. You must always think step-by-step. Put
  your thinking process inside <think> and </think> tags, and put your final answer
  inside <answer> and </answer> tags.

  '
training:
  beta: 0.0
  bf16: true
  epsilon_high: null
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  kl_coeff: 0.0
  learning_rate: 5.0e-06
  logging_steps: 1
  loss_type: dapo
  lr_scheduler_type: constant
  mask_truncated_completions: false
  max_grad_norm: 1.0
  max_steps: 600
  num_train_epochs: 2
  output_dir: /ephemeral/queue2/atoms_ctrl_seed1
  save_final: false   # checkpoint-600 has the same weights
  per_device_train_batch_size: 2
  report_to:
  - tensorboard
  save_only_model: true
  save_steps: 100000   # only save_at_steps
  save_at_steps: [150, 300, 450, 600]
  save_strategy: steps
  warmup_ratio: 0.0
vllm:
  enabled: true
  stop_strings: true
  mode: colocate
  gpu_memory_utilization: 0.2
  enable_sleep_mode: false
  importance_sampling_correction: false
