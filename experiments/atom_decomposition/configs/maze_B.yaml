# ============================================================================
# Maze A/B/C test, arm B: hard mazes with half the prompts replaced by easier whole mazes (path 1-9).
# The curriculum control: does easiness alone help? Same mazes as arm C's atoms come from.
# Checkpoints 100/200/300 on /ephemeral (the volume is nearly full).
# ============================================================================
environment:
  atom_mix:
    fraction: 0.5
    task_params:   # easier mazes: path 1-9 on 5-10 grids (the probe's easy + default range)
      min_dist: 1
      max_dist: 9
      min_grid_size: 5
      max_grid_size: 10
  strict_format: true
  length_penalty: false
  max_rollout_length: 2048
  name: reasoning_gym
  samples: 5000
  task_name: maze
  task_params:
    min_dist: 10
    max_dist: 15
    min_grid_size: 10
    max_grid_size: 14
generation:
  generation_batch_size: 32
  max_completion_length: 2048
  max_prompt_length: 1024   # atom prompts list reached cells (up to ~900 chars)
  num_generations: 8
  stop_strings:
  - </answer>
  temperature: 1.0
generation_logging:
  enabled: true
  every_n_steps: 25
  print_n_examples: 1
model:
  name_or_path: /data/rlvr/sft_qwen3_4b
  torch_dtype: bfloat16
seed: 1
system_prompt: 'You are a helpful assistant. You must always think step-by-step. Put
  your thinking process inside <think> and </think> tags, and put your final answer
  inside <answer> and </answer> tags.

  '
training:
  beta: 0.0
  bf16: true
  epsilon_high: null
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  kl_coeff: 0.0
  learning_rate: 5.0e-06
  logging_steps: 1
  loss_type: dapo
  lr_scheduler_type: constant
  mask_truncated_completions: false
  max_grad_norm: 1.0
  max_steps: 300
  num_train_epochs: 2
  output_dir: /ephemeral/maze/maze_B_seed1
  save_final: false   # checkpoint-300 has the same weights
  per_device_train_batch_size: 2
  report_to:
  - tensorboard
  save_only_model: true
  save_steps: 100
  save_strategy: steps
  warmup_ratio: 0.0
vllm:
  enabled: true
  stop_strings: true
  mode: colocate
  gpu_memory_utilization: 0.2
  enable_sleep_mode: false
  importance_sampling_correction: false
